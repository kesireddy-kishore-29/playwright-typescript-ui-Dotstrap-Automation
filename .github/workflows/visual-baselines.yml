name: Visual baselines (Linux)

# One-off (and after an intended visual change): generates the Linux screenshot baselines on the
# same runner image CI uses and opens a pull request with them. Font rendering differs between
# operating systems, so the Windows baselines in the repository cannot be reused on Linux.
# Review every image before merging; a baseline is an assertion.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  CI: 'true'

jobs:
  baselines:
    name: Generate Linux baselines and open a pull request
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Write the baselines
        run: npx playwright test --project=visual --update-snapshots=all
      - name: Check the new baselines pass unchanged
        run: npx playwright test --project=visual
      - name: Upload the baselines for review
        uses: actions/upload-artifact@v7
        with:
          name: linux-visual-baselines
          path: tests/visual/__screenshots__/linux/
          retention-days: 14
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet HEAD -- tests/visual/__screenshots__/linux \
            && [ -z "$(git ls-files --others --exclude-standard tests/visual/__screenshots__/linux)" ]; then
            echo "Linux baselines are unchanged."
            exit 0
          fi
          branch="visual/linux-baselines-$(date -u +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add tests/visual/__screenshots__/linux
          git commit -m "test(visual): Linux baselines generated on ubuntu-latest"
          git push -u origin "$branch"
          gh pr create --title "Linux visual baselines" \
            --body "Generated by run ${{ github.run_id }} on ubuntu-latest. Review every image; merging them makes CI compare against them."
