name: Heal

# Governed self-healing. Reads the triaged failures of a nightly run and, for the healable
# categories only, proposes a fix on a heal/* branch. Guardrails are enforced in code (page objects
# and components only, no hard waits, no longer timeouts, no loosened locators or assertions);
# each fix must pass the failing test 3 times and its file before a pull request is opened. A
# person reviews and merges; nothing merges here.
#
# Pull requests opened with the workflow token do not trigger other workflows (a GitHub rule);
# close and reopen the pull request, or push to it, to run CI on the proposed fix.

on:
  workflow_run:
    workflows: [Nightly]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Actions run ID of the Nightly run whose failures to heal
        required: true

concurrency:
  group: heal
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: read

env:
  CI: 'true'

jobs:
  heal:
    name: Propose guarded, verified fixes
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Download the triaged nightly run
        uses: actions/download-artifact@v8
        with:
          name: merged-run
          path: run-evidence/playwright-typescript-ui-Dotstrap-Automation
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Labels used by heal pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create self-healed --color 1d76db --force \
            --description "Proposed by the healing pipeline; needs human review"
          gh label create needs-contract-decision --color d93f0b --force \
            --description "Contract drift: provider bug or agreed change?"
      - name: Heal (at most 3 pull requests per run; the verifier starts sut-ui itself)
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          run_dir=$(find run-evidence/playwright-typescript-ui-Dotstrap-Automation -mindepth 1 -maxdepth 1 -type d | head -n 1)
          npm run qa -- heal --run "$run_dir" --open-prs --max-prs 3
      - name: Upload the healing record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: healing-${{ github.run_id }}
          path: run-evidence/playwright-typescript-ui-Dotstrap-Automation/*/healing/
          retention-days: 30
          if-no-files-found: ignore
